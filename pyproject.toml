[project]
name = "tise-research"
version = "0.1.0"
description = "Research tier for Tise. Runs on the author's machine only; never shipped."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    # Declared explicitly, though scikit-learn and xgboost already pull it in. D99's
    # replication needs a vectorised trainer to be affordable at all, and depending on a
    # transitive install is how a build breaks the day one of those is dropped.
    #
    # **Research tier only.** The extension ships no Python and no numpy; `logreg.py` stays
    # hand-written full-batch gradient descent because it has to run in a browser and be
    # reproducible to 1e-9 against its TypeScript twin. The numpy trainer is a faster route
    # to the *same* function, and `test_fast_logreg.py` has to prove that before it is
    # allowed to produce a published number.
    "numpy>=2.0",
    "pytest>=8.0",
    "ruff>=0.6",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research/tise_research"]

[tool.pytest.ini_options]
testpaths = ["research/tests"]
# `analysis/` is scripts rather than an installed package, but the ones that write a
# committed report carry real logic — D86's monotone verdict is a published structural
# claim — and untested logic behind a published number is the thing this repo is about.
pythonpath = ["."]
markers = [
    "parity: TypeScript/Python feature parity. CI-blocking from T17.",
]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
